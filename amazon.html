<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="amazon.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
        integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>

</head>

<body>
    <header>
        <!-- box-1 -->
        <div class="navbar">
            <div class="nav-logo border border">
                <div class="logo"></div>
            </div>
            <!-- box-2 -->
            <div class="adress border">
                <p class="location">Deliver to</p>
                <div class="location-icon">
                    <i class="fa-solid fa-globe"></i>
                    <p class="india">INDIA</p>
                </div>
            </div>
            <!-- box-3 -->
            <div class="nav-search">
                <select class="search-select">
                    <option>ALL</option>
                </select>
                <input Placeholder="Search Amazon" class="input-search">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass magni-glass"></i>
                </div>
            </div>
            <!-- box-4 -->
            <div class="sign border">
                <p><span class="sign-nav">Hello,Sign in</span></p>
                <p class="account">Account & Lists</p>
            </div>
            <!-- box-5 -->
            <div class="return border">
                <p><span class="nav-return">Returns</span></p>
                <p class="order">& Orders</p>
            </div>
            <!-- box-5 -->
            <div class="cart border">
                <i class="fa-solid fa-cart-shopping carts"></i>
                <p>Cart</p>
            </div>
        </div>
        <!-- pannel -->
        <!-- box-1 -->
        <div class="pannel">
            <div class="all-icon border">
                <i class="fa-solid fa-bars">All</i>
            </div>
            <div class="pannel-option">
                <p class="border">Today's Deal</p>
                <p class="border">Customer Service</p>
                <p class="border">Registry</p>
                <p class="border">Gift Cards</p>
                <p class="border">Sell</p>
            </div>
            <div class="pannel-deals border">
                Shops deals in Electronics
            </div>
        </div>
    </header>
    <!-- Hero-section -->
     
    <div class="major"></div>
      <div class="upalexa"></div>
      <div class="alexa"></div>

<div class="hero-section">

        <div class="om3"></div>
        <div class="om4"></div>
        <div class="om5"></div>
        <div class="om6"></div>
        <div class="om7"></div> -->
        </div>
</body>

</html>
